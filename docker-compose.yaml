services:
  db:
    container_name: postgres_container
    image: postgres:17
    ports:
      - "5000:5432"
    environment:
      POSTGRES_USER: jj_user
      POSTGRES_PASSWORD: jj_password
      POSTGRES_DB: weather_db
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    networks:
      - my_network


  af:
    container_name: airflow_container
    image: apache/airflow:latest
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./api-requests:/opt/airflow/api-requests
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: 
      - db
    networks:
      - my_network
    command: >
      bash -c "airflow db migrate && airflow standalone"


  dbt:
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    volumes:
      - ./dbt/my_project:/usr/app
    working_dir: /usr/app
    depends_on:
      - db
    networks:
      - my_network
    command: run


networks:
  my_network:
    driver: bridge